<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0b0e" />
<title>LED Detailing CRM</title>
<link rel="icon" href="../assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0b0e; --surface:#12151b; --surface2:#171b22; --surface3:#1e232c; --line:#262b34;
  --ink:#eef0f3; --muted:#9ea5b1; --faint:#6c7480;
  --pink:#F196E1; --blue:#5E9CDA; --green:#5ccf9a; --amber:#f2c260; --red:#ee6a7a;
  --r:14px; --shadow:0 12px 34px rgba(0,0,0,.5);
  --head:"Sora","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;display:grid;grid-template-columns:236px 1fr}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
ul{list-style:none}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.01em;line-height:1.2}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.brand img{height:44px;width:auto}
.brand b{font-family:var(--head);font-size:1.02rem;display:block;line-height:1.05}
.brand small{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.92rem;text-align:left;position:relative}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:linear-gradient(90deg,rgba(241,150,225,.16),rgba(94,156,218,.08));color:var(--ink);box-shadow:inset 3px 0 0 var(--pink)}
.nav .badge{margin-left:auto;background:var(--pink);color:#18101a;border-radius:99px;font-size:.7rem;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--faint);padding:10px 8px;border-top:1px solid var(--line)}
.side-foot button{display:block;color:var(--blue);font-weight:600;font-size:.78rem;margin-top:4px}

/* ---------- main ---------- */
main{min-width:0;padding:0 28px 60px}
.top{position:sticky;top:0;z-index:20;background:rgba(10,11,14,.88);backdrop-filter:blur(12px);display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.top h1{font-size:1.45rem;margin-right:auto}
.search{position:relative;width:min(300px,38vw)}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 14px 9px 38px;outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:99px;border:1.5px solid transparent;white-space:nowrap;transition:.18s}
.btn-pink{background:var(--pink);color:#1a0f19}
.btn-pink:hover{background:#f7b0ea;transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{color:var(--red);border-color:rgba(238,106,122,.4)}
.btn-danger:hover{background:rgba(238,106,122,.12)}
.btn-sm{padding:6px 12px;font-size:.78rem}

/* ---------- common ---------- */
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 .sub{margin-left:auto;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--faint)}
.kpi .lab{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--head);font-size:1.9rem;font-weight:600;margin:6px 0 2px;line-height:1.1}
.kpi .note{font-size:.8rem;color:var(--faint)}
.kpi.a .val{color:var(--pink)} .kpi.b .val{color:var(--blue)} .kpi.c .val{color:var(--green)} .kpi.d .val{color:var(--amber)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:26px 10px;font-size:.9rem}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer} .row.click:hover .t{color:var(--pink)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--blue)}
.dot.pink{background:var(--pink)} .dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:var(--surface3);color:var(--muted);white-space:nowrap}
.tag.pink{background:rgba(241,150,225,.16);color:var(--pink)} .tag.blue{background:rgba(94,156,218,.16);color:var(--blue)}
.tag.green{background:rgba(92,207,154,.15);color:var(--green)} .tag.amber{background:rgba(242,194,96,.15);color:var(--amber)} .tag.red{background:rgba(238,106,122,.15);color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:.74rem;color:var(--muted)}
.bars .bar{width:100%;max-width:46px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--pink),var(--blue));min-height:3px}
.bars .bv{color:var(--ink);font-weight:600;font-size:.74rem}

/* ---------- pipeline ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.col.over{border-color:var(--pink);background:rgba(241,150,225,.05)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-family:var(--head);font-weight:600;font-size:.9rem}
.col-h .sum{margin-left:auto;font-family:var(--body);font-weight:500;font-size:.76rem;color:var(--faint)}
.col-h .n{background:var(--surface3);border-radius:99px;font-size:.72rem;padding:1px 8px;color:var(--muted);font-family:var(--body)}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.card.dragging{opacity:.4}
.card .cn{font-weight:700;margin-bottom:1px}
.card .cv{font-size:.82rem;color:var(--muted)}
.card .cm{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.card .cm .price{margin-left:auto;font-weight:700;font-family:var(--head)}
.card .ca{display:flex;gap:6px;margin-top:10px}
.stage-new{border-left:3px solid var(--pink)} .stage-quoted{border-left:3px solid var(--amber)} .stage-booked{border-left:3px solid var(--blue)} .stage-completed{border-left:3px solid var(--green)} .stage-lost{border-left:3px solid var(--faint)}

/* ---------- schedule ---------- */
.wk{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.wk h2{font-size:1.05rem;margin-right:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:150px}
.day.today{border-color:var(--pink);box-shadow:0 0 0 1px rgba(241,150,225,.3)}
.day-h{display:flex;align-items:baseline;gap:6px;font-size:.78rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.day-h b{font-family:var(--head);font-size:1.15rem;color:var(--ink)}
.day-h button{margin-left:auto;color:var(--faint);font-size:1.1rem;line-height:1}
.day-h button:hover{color:var(--pink)}
.ev{background:var(--surface2);border-left:3px solid var(--blue);border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:.8rem;cursor:pointer}
.ev:hover{background:var(--surface3)}
.ev.completed{border-left-color:var(--green)}
.ev b{display:block;font-size:.82rem}
.ev .tm{color:var(--pink);font-weight:700;font-size:.74rem}
.ev .ls{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.tbl .nm{font-weight:700} .tbl .sub{color:var(--muted);font-size:.8rem}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- forms / modal ---------- */
#modal,#modal2{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:rgba(3,4,6,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
#modal2 .scrim{z-index:110}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow);padding:22px;animation:pop .16s ease}
.sheet.sm{max-width:460px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{font-size:1.2rem;margin-right:auto}
.x{color:var(--muted);font-size:1.5rem;line-height:1;padding:0 6px}
.x:hover{color:var(--ink)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label,.lbl{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:76px;resize:vertical}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.84rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;cursor:pointer}
.chk input{accent-color:var(--pink)}
.chk label:has(input:checked){border-color:var(--pink);background:rgba(241,150,225,.1)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.actions .sp{margin-left:auto}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.msgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* ---------- settings ---------- */
.set-row{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px}
.set-tpl{margin-bottom:14px}
.set-tpl textarea{min-height:112px}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth[hidden]{display:none}
.auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.auth-box img{height:72px;margin:0 auto 10px;display:block}
.auth-box h2{text-align:center;font-size:1.25rem;margin-bottom:4px}
.auth-box p.sub{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:20px}
.auth-box .fld{margin-bottom:12px}
.auth-err{color:var(--red);font-size:.84rem;min-height:1.2em;margin:4px 0 10px}
.auth-link{display:block;margin:14px auto 0;color:var(--blue);font-size:.84rem;font-weight:600}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  body{grid-template-columns:1fr;padding-bottom:70px}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:50;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:.62rem;padding:6px 4px;flex:1;align-items:center;text-align:center}
  .nav button.on{box-shadow:none;background:var(--surface2);color:var(--pink)}
  .nav .badge{position:absolute;top:1px;right:calc(50% - 20px);margin:0;font-size:.6rem;padding:0 5px;min-width:16px}
  main{padding:0 14px 40px}
  .top{padding:12px 0;flex-wrap:wrap;gap:10px}
  .top h1{font-size:1.2rem}
  .search{order:3;width:100%}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:1.5rem}
  .f{grid-template-columns:1fr}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .hide-m{display:none}
  .row{flex-wrap:wrap}
  .row .grow{flex-basis:calc(100% - 30px)}
  .row>div[style*=flex-shrink]{padding-left:21px}
  .panel{padding:14px}
  .sheet{padding:18px}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand"><img src="../assets/logo.png" alt="LED logo" onerror="this.style.display='none'" /><div><b>LED Detailing</b><small>CRM</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><div id="bkStatus"></div><button data-act="backup">Download backup</button><button data-act="signout" id="soBtn" hidden>Sign out</button></div>
</aside>

<main>
  <div class="top">
    <h1 id="title">Dashboard</h1>
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search name, phone, vehicle…" autocomplete="off" /></label>
    <button class="btn btn-pink" data-act="newJob">+ New Lead</button>
  </div>
  <div id="view"></div>
</main>

<div id="auth" hidden>
  <form class="auth-box" id="authForm" autocomplete="on">
    <img src="../assets/logo.png" alt="LED logo" onerror="this.style.display='none'" />
    <h2>LED Detailing CRM</h2>
    <p class="sub">Sign in to continue</p>
    <div class="fld"><label for="authEmail">Email</label><input id="authEmail" type="email" required autocomplete="username" /></div>
    <div class="fld"><label for="authPw">Password</label><input id="authPw" type="password" required autocomplete="current-password" /></div>
    <div class="auth-err" id="authErr" role="alert"></div>
    <button class="btn btn-pink" type="submit" style="width:100%">Sign in</button>
    <button class="auth-link" type="button" id="authReset">Forgot password?</button>
  </form>
</div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  /* =============================== helpers =============================== */
  var KEY = "led_crm_v1";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var uid = function () { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); };
  var money = function (n) { n = Number(n) || 0; return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 }); };
  var digits = function (p) { return String(p || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, ""); };
  var fmtPhone = function (p) { var d = digits(p); return d.length === 10 ? "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6) : (p || ""); };
  var pd = function (s) { var a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  var fd = function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  var today = function () { return fd(new Date()); };
  var addDays = function (s, n) { var d = pd(s); d.setDate(d.getDate() + n); return fd(d); };
  var daysBetween = function (a, b) { return Math.round((pd(b) - pd(a)) / 864e5); };
  var weekStartOf = function (s) { var d = pd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fd(d); };
  var nice = function (s) { return s ? pd(s).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : ""; };
  var niceLong = function (s) { return s ? pd(s).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) : ""; };
  var ftime = function (t) { if (!t) return ""; var a = t.split(":").map(Number), h = a[0], m = a[1]; return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + " " + (h >= 12 ? "PM" : "AM"); };
  var ageDays = function (iso) { return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : 0; };
  var nowISO = function () { return new Date().toISOString(); };
  var sum = function (arr, f) { return arr.reduce(function (t, x) { return t + (Number(f(x)) || 0); }, 0); };

  var ICON = {
    dash: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
    pipe: '<rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
    set: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'
  };
  var icon = function (k) { return '<svg class="i" viewBox="0 0 24 24">' + ICON[k] + "</svg>"; };

  /* ================================ data ================================= */
  var DEFAULT_TPL = {
    quote: "Hi {first}, this is {business}! For your {vehicle}, the {package} is {price}. We come to you anywhere in Cincinnati & Northern Kentucky. Want me to get you on the schedule?",
    confirm: "Hi {first}, you're booked with {business} for {date} at {time}: {package} on your {vehicle}. Location: {location}. Reply here if anything changes!",
    reminder: "Hi {first}, just a reminder that your detail is {date} at {time}. See you then! If you need to reschedule, just text me.",
    omw: "Hi {first}, we're on our way to you now. See you shortly!",
    review: "Hi {first}, thanks for choosing {business}! If you're happy with how your {vehicle} turned out, a quick Google review helps us a ton: {reviewLink}",
    rebook: "Hi {first}, it's been a little while since we detailed your {vehicle}. Want to get a refresh on the schedule? Reply with a day that works and I'll lock it in."
  };
  var TPL_LABEL = { quote: "Send quote", confirm: "Confirm booking", reminder: "Reminder", omw: "On my way", review: "Ask for review", rebook: "Rebook nudge" };
  var STAGES = [
    { id: "new", label: "New Lead", dot: "pink" },
    { id: "quoted", label: "Quoted", dot: "amber" },
    { id: "booked", label: "Booked", dot: "" },
    { id: "completed", label: "Completed", dot: "green" },
    { id: "lost", label: "Lost", dot: "red" }
  ];
  var SOURCES = ["Website form", "Call / text", "Instagram", "Referral", "Repeat customer", "Other"];
  var SIZES = ["Car / sedan / coupe", "Small SUV / crossover", "Large SUV / minivan / 3-row", "Truck", "Other"];
  var PAY = ["Cash", "Venmo", "Zelle", "Cash App", "Card", "Check"];

  function defaults() {
    return {
      v: 1,
      settings: {
        business: "LED Detailing", reviewLink: "", rebookDays: 60, lastBackup: null,
        packages: [
          { name: "Basic Interior", price: 65 }, { name: "Platinum Interior", price: 100 },
          { name: "Basic Exterior", price: 65 }, { name: "Platinum Exterior", price: 100 },
          { name: "Full Detail: sedan/SUV", price: 140 }, { name: "Full Detail: truck", price: 200 }
        ],
        addons: [
          { name: "Pet hair removal", price: 0 }, { name: "Seat extraction", price: 0 },
          { name: "Trim restoration", price: 0 }, { name: "Wax protection", price: 0 }, { name: "Ceramic coating", price: 0 }
        ],
        templates: JSON.parse(JSON.stringify(DEFAULT_TPL))
      },
      customers: [], jobs: []
    };
  }
  var db, memOnly = false;
  function load() {
    var base = defaults();
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        base.customers = d.customers || []; base.jobs = d.jobs || [];
        var s = d.settings || {};
        Object.keys(s).forEach(function (k) { if (k !== "templates") base.settings[k] = s[k]; });
        Object.keys(s.templates || {}).forEach(function (k) { base.settings.templates[k] = s.templates[k]; });
      }
    } catch (e) { memOnly = true; }
    return base;
  }
  function save() {
    if (cloud.on) { pushDiff(); return; }
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { memOnly = true; }
  }
  db = load();
  var cfg = window.LED_FIREBASE || {};
  var cloud = { on: !!(cfg.apiKey && cfg.projectId && window.firebase), user: null, ready: false, fs: null, unsubs: [], shadow: { customers: {}, jobs: {}, settings: "" } };
  var localCache = db;            // data saved on this device (offered for upload on first sign-in)
  if (cloud.on) db = defaults();

  var state = { view: "dashboard", q: "", weekStart: weekStartOf(today()) };

  /* ---- lookups ---- */
  var cust = function (id) { return db.customers.filter(function (c) { return c.id === id; })[0] || { name: "(unknown)", phone: "" }; };
  var job = function (id) { return db.jobs.filter(function (j) { return j.id === id; })[0]; };
  var jobTotal = function (j) { return (Number(j.price) || 0) + (Number(j.tip) || 0); };
  var pkgPrice = function (name) { var p = db.settings.packages.filter(function (x) { return x.name === name; })[0]; return p ? Number(p.price) || 0 : 0; };
  var addonPrice = function (name) { var p = db.settings.addons.filter(function (x) { return x.name === name; })[0]; return p ? Number(p.price) || 0 : 0; };
  var stageLabel = function (id) { return STAGES.filter(function (s) { return s.id === id; })[0].label; };

  function custStats(c) {
    var js = db.jobs.filter(function (j) { return j.customerId === c.id; });
    var done = js.filter(function (j) { return j.stage === "completed"; });
    var open = js.filter(function (j) { return ["new", "quoted", "booked"].indexOf(j.stage) > -1; });
    var last = done.map(function (j) { return j.date; }).filter(Boolean).sort().pop() || "";
    var life = sum(done.filter(function (j) { return j.paid; }), jobTotal);
    var status = "Lead", cls = "";
    if (open.length) { status = "Active"; cls = "blue"; }
    else if (done.length) {
      if (last && daysBetween(last, today()) >= db.settings.rebookDays) { status = "Rebook due"; cls = "pink"; }
      else { status = "Customer"; cls = "green"; }
    }
    return { jobs: js, done: done, open: open, last: last, life: life, status: status, cls: cls };
  }

  function matches(j) {
    var q = state.q.trim().toLowerCase(); if (!q) return true;
    var c = cust(j.customerId);
    var hay = [c.name, c.phone, digits(c.phone), j.vehicle, j.package, j.location, j.notes, j.source].join(" ").toLowerCase();
    return hay.indexOf(q) > -1 || (digits(q).length > 2 && digits(c.phone).indexOf(digits(q)) > -1);
  }

  /* ============================== follow-ups ============================= */
  function followups() {
    var t = today(), tm = addDays(t, 1), out = [];
    db.jobs.forEach(function (j) {
      var c = cust(j.customerId), nm = c.name;
      if (j.stage === "new") out.push({ pri: 1, color: "pink", title: "Reply to " + nm, sub: [j.vehicle, j.package || "Package not chosen"].filter(Boolean).join(" · ") + " · " + (ageDays(j.created) ? ageDays(j.created) + "d ago" : "today"), job: j.id, tpl: "quote", label: "Text quote" });
      if (j.stage === "quoted" && ageDays(j.updated) >= 2) out.push({ pri: 3, color: "amber", title: "Follow up on quote: " + nm, sub: money(j.price) + " · quoted " + ageDays(j.updated) + " days ago", job: j.id, tpl: "quote", label: "Text follow-up" });
      if (j.stage === "booked" && (j.date === t || j.date === tm)) out.push({ pri: 2, color: "", title: (j.date === t ? "Today" : "Tomorrow") + (j.time ? " " + ftime(j.time) : "") + ": " + nm, sub: [j.vehicle, j.package, j.location].filter(Boolean).join(" · "), job: j.id, tpl: "reminder", label: "Text reminder" });
      if (j.stage === "completed" && !j.paid) out.push({ pri: 2, color: "red", title: "Collect payment: " + nm, sub: money(j.price) + " owed · " + nice(j.date), job: j.id, act: "markPaid", label: "Mark paid" });
      if (j.stage === "completed" && !j.reviewAsked && j.date && daysBetween(j.date, t) <= 14 && daysBetween(j.date, t) >= 0) out.push({ pri: 4, color: "green", title: "Ask " + nm + " for a review", sub: j.vehicle + " · detailed " + nice(j.date), job: j.id, tpl: "review", label: "Text review ask" });
    });
    db.customers.forEach(function (c) {
      var s = custStats(c);
      if (s.status === "Rebook due" && !(c.snoozeUntil && c.snoozeUntil > t)) {
        out.push({ pri: 5, color: "pink", title: "Rebook nudge: " + c.name, sub: "Last detail " + nice(s.last) + " (" + daysBetween(s.last, t) + " days ago) · " + money(s.life) + " lifetime", cust: c.id, tpl: "rebook", label: "Text nudge", snooze: true });
      }
    });
    out.sort(function (a, b) { return a.pri - b.pri; });
    return out;
  }

  /* ================================ views ================================ */
  function jobCardMini(j) {
    var c = cust(j.customerId);
    return '<div class="row click" data-act="editJob" data-id="' + j.id + '"><span class="dot ' + (j.stage === "completed" ? "green" : "") + '"></span><div class="grow"><div class="t">' + esc(c.name) + '</div><div class="s">' + esc([j.vehicle, j.package].filter(Boolean).join(" · ")) + '</div></div><div style="text-align:right"><div class="t">' + esc(nice(j.date)) + '</div><div class="s">' + esc(ftime(j.time) || money(j.price)) + "</div></div></div>";
  }

  function fuRow(f) {
    var btns = "";
    if (f.tpl) btns += '<button class="btn btn-ghost btn-sm" data-act="msg" ' + (f.job ? 'data-job="' + f.job + '"' : 'data-cust="' + f.cust + '"') + ' data-tpl="' + f.tpl + '">' + f.label + "</button>";
    if (f.act === "markPaid") btns += '<button class="btn btn-ghost btn-sm" data-act="markPaid" data-id="' + f.job + '">' + f.label + "</button>";
    if (f.snooze) btns += '<button class="btn btn-ghost btn-sm" data-act="snooze" data-id="' + f.cust + '" title="Hide for 30 days">Snooze</button>';
    var open = f.job ? 'data-act="editJob" data-id="' + f.job + '"' : 'data-act="openCust" data-id="' + f.cust + '"';
    return '<div class="row"><span class="dot ' + f.color + '"></span><div class="grow click" style="cursor:pointer" ' + open + '><div class="t">' + esc(f.title) + '</div><div class="s">' + esc(f.sub) + '</div></div><div style="display:flex;gap:6px;flex-shrink:0">' + btns + "</div></div>";
  }

  var VIEWS = {};

  VIEWS.dashboard = function () {
    var t = today(), mo = t.slice(0, 7);
    if (!db.jobs.length && !db.customers.length) {
      return '<div class="panel" style="text-align:center;padding:48px 20px"><h2 style="justify-content:center;font-size:1.3rem;margin-bottom:8px">Welcome to your CRM</h2><p class="muted" style="max-width:48ch;margin:0 auto 22px">Track every lead from the first text to the final payment. Add your first lead"+(cloud.on?" or wait for one to arrive from your website form.":", import your website form submissions, or load sample data to look around.")+"</p><div class="actions" style="justify-content:center"><button class="btn btn-pink" data-act="newJob">+ Add first lead</button>' + (cloud.on ? '' : '<button class="btn btn-ghost" data-act="sample">Load sample data</button>') + '<button class="btn btn-ghost" data-act="goto" data-view="settings">Import form submissions</button></div></div>';
    }
    var newN = db.jobs.filter(function (j) { return j.stage === "new"; }).length;
    var wk = weekStartOf(t), wkEnd = addDays(wk, 6);
    var bookedWk = db.jobs.filter(function (j) { return j.stage === "booked" && j.date >= wk && j.date <= wkEnd; });
    var revMo = sum(db.jobs.filter(function (j) { return j.paid && j.date && j.date.slice(0, 7) === mo; }), jobTotal);
    var owed = db.jobs.filter(function (j) { return j.stage === "completed" && !j.paid; });
    var fu = followups();
    var upcoming = db.jobs.filter(function (j) { return j.stage === "booked" && j.date && j.date >= t; }).sort(function (a, b) { return (a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1; }).slice(0, 5);
    // 6-month revenue
    var months = [], d = new Date(); d.setDate(1);
    for (var i = 5; i >= 0; i--) { var m = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push({ k: m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0"), l: m.toLocaleDateString("en-US", { month: "short" }), v: 0 }); }
    db.jobs.forEach(function (j) { if (j.paid && j.date) months.forEach(function (m) { if (m.k === j.date.slice(0, 7)) m.v += jobTotal(j); }); });
    var mx = Math.max.apply(null, months.map(function (m) { return m.v; }).concat([1]));
    var won = db.jobs.filter(function (j) { return j.stage === "booked" || j.stage === "completed"; }).length, lost = db.jobs.filter(function (j) { return j.stage === "lost"; }).length;
    var pipeVal = sum(db.jobs.filter(function (j) { return j.stage === "quoted" || j.stage === "booked"; }), function (j) { return j.price; });

    return '<div class="grid kpis">' +
      '<div class="panel kpi a"><div class="lab">New leads</div><div class="val">' + newN + '</div><div class="note">waiting for a reply</div></div>' +
      '<div class="panel kpi b"><div class="lab">Booked this week</div><div class="val">' + bookedWk.length + '</div><div class="note">' + money(sum(bookedWk, function (j) { return j.price; })) + " scheduled</div></div>" +
      '<div class="panel kpi c"><div class="lab">Revenue this month</div><div class="val">' + money(revMo) + '</div><div class="note">paid jobs only</div></div>' +
      '<div class="panel kpi d"><div class="lab">Unpaid</div><div class="val">' + money(sum(owed, function (j) { return j.price; })) + '</div><div class="note">' + owed.length + " completed job" + (owed.length === 1 ? "" : "s") + "</div></div></div>" +
      '<div class="grid two" style="margin-top:16px">' +
        '<div class="panel"><h2>Needs attention<span class="sub">' + fu.length + " item" + (fu.length === 1 ? "" : "s") + '</span></h2>' + (fu.length ? fu.slice(0, 6).map(fuRow).join("") + (fu.length > 6 ? '<div style="text-align:center;margin-top:10px"><button class="btn btn-ghost btn-sm" data-act="goto" data-view="followups">See all ' + fu.length + "</button></div>" : "") : '<div class="empty">All caught up. Nice work.</div>') + "</div>" +
        '<div class="panel"><h2>Next up<span class="sub">booked jobs</span></h2>' + (upcoming.length ? upcoming.map(jobCardMini).join("") : '<div class="empty">Nothing on the schedule yet.</div>') + "</div>" +
      "</div>" +
      '<div class="grid two" style="margin-top:16px">' +
        '<div class="panel"><h2>Revenue<span class="sub">last 6 months · paid</span></h2><div class="bars">' + months.map(function (m) { return '<div class="bc"><span class="bv">' + (m.v ? money(m.v) : "") + '</span><div class="bar" style="height:' + Math.max(2, Math.round(m.v / mx * 100)) + '%"></div>' + m.l + "</div>"; }).join("") + "</div></div>" +
        '<div class="panel"><h2>Pipeline</h2>' + STAGES.map(function (s) { var js = db.jobs.filter(function (j) { return j.stage === s.id; }); return '<div class="row"><span class="dot ' + s.dot + '"></span><div class="grow t">' + s.label + '</div><span class="muted">' + js.length + '</span><span style="width:70px;text-align:right;font-weight:600">' + (s.id === "lost" ? "" : money(sum(js, function (j) { return j.price; }))) + "</span></div>"; }).join("") +
        '<div class="row"><div class="grow muted">Open pipeline value</div><b>' + money(pipeVal) + '</b></div><div class="row"><div class="grow muted">Win rate</div><b>' + (won + lost ? Math.round(won / (won + lost) * 100) + "%" : "–") + "</b></div></div>" +
      "</div>";
  };

  function cardHTML(j) {
    var c = cust(j.customerId);
    var next = { new: "quoted", quoted: "booked", booked: "completed" }[j.stage];
    var btns = "";
    if (next) btns += '<button class="btn btn-ghost btn-sm" data-act="advance" data-id="' + j.id + '">→ ' + stageLabel(next) + "</button>";
    if (j.stage === "completed" && !j.paid) btns += '<button class="btn btn-ghost btn-sm" data-act="markPaid" data-id="' + j.id + '">Mark paid</button>';
    if (c.phone) btns += '<a class="btn btn-ghost btn-sm" href="tel:' + digits(c.phone) + '" data-stop="1">Call</a>';
    return '<div class="card stage-' + j.stage + '" draggable="true" data-act="editJob" data-id="' + j.id + '">' +
      '<div class="cn">' + esc(c.name) + '</div><div class="cv">' + esc(j.vehicle || "Vehicle not given") + "</div>" +

      '<span class="price">' + (j.price ? money(j.price) : "") + "</span></div>" +
      (btns ? '<div class="ca">' + btns + "</div>" : "") + "</div>";
  }

  VIEWS.pipeline = function () {
    return '<div class="board">' + STAGES.map(function (s) {
      var js = db.jobs.filter(function (j) { return j.stage === s.id && matches(j); }).sort(function (a, b) { return (b.updated || "") < (a.updated || "") ? -1 : 1; });
      return '<div class="col" data-stage="' + s.id + '"><div class="col-h"><span class="dot ' + s.dot + '"></span>' + s.label + '<span class="n">' + js.length + '</span><span class="sum">' + (s.id === "lost" ? "" : money(sum(js, function (j) { return j.price; }))) + "</span></div>" + (js.length ? js.map(cardHTML).join("") : '<div class="empty" style="padding:18px 4px">Drop jobs here</div>') + "</div>";
    }).join("") + "</div>";
  };

  VIEWS.schedule = function () {
    var ws = state.weekStart, we = addDays(ws, 6), t = today(), cols = "";

      var ds = addDays(ws, i);
      var evs = db.jobs.filter(function (j) { return j.date === ds && (j.stage === "booked" || j.stage === "completed") && matches(j); }).sort(function (a, b) { return (a.time || "99") < (b.time || "99") ? -1 : 1; });
      cols += '<div class="day ' + (ds === t ? "today" : "") + '"><div class="day-h">' + pd(ds).toLocaleDateString("en-US", { weekday: "short" }) + " <b>" + pd(ds).getDate() + '</b><button data-act="newJob" data-date="' + ds + '" title="Add a job">+</button></div>' +
        (evs.length ? evs.map(function (j) { var c = cust(j.customerId); return '<div class="ev ' + j.stage + '" data-act="editJob" data-id="' + j.id + '">' + (j.time ? '<span class="tm">' + ftime(j.time) + "</span>" : "") + "<b>" + esc(c.name) + '</b><span class="ls">' + esc(j.package || j.vehicle || "") + '</span><span class="ls">' + esc(j.location || "") + "</span></div>"; }).join("") : '<div class="faint" style="font-size:.78rem">–</div>') + "</div>";
    }
    var undated = db.jobs.filter(function (j) { return j.stage === "booked" && !j.date && matches(j); });
    var rangeLbl = pd(ws).toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " – " + pd(we).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    return '<div class="wk"><h2>' + rangeLbl + '</h2><button class="btn btn-ghost btn-sm" data-act="wk" data-n="-7">← Prev</button><button class="btn btn-ghost btn-sm" data-act="wk" data-n="0">This week</button><button class="btn btn-ghost btn-sm" data-act="wk" data-n="7">Next →</button></div>' +
      '<div class="week">' + cols + "</div>" +
      (undated.length ? '<div class="panel" style="margin-top:16px"><h2>Booked, no date yet<span class="sub">' + undated.length + "</span></h2>" + undated.map(jobCardMini).join("") + "</div>" : "");
  };

  VIEWS.customers = function () {
    var q = state.q.trim().toLowerCase();

      if (!q) return true;

      return hay.indexOf(q) > -1;
    }).sort(function (a, b) { return (b.s.last || "") < (a.s.last || "") ? -1 : (b.s.last || "") > (a.s.last || "") ? 1 : a.c.name.localeCompare(b.c.name); });

      list.map(function (x) { return '<tr class="click" data-act="openCust" data-id="' + x.c.id + '"><td><div class="nm">' + esc(x.c.name) + '</div><div class="sub">' + esc(fmtPhone(x.c.phone)) + '</div></td><td class="hide-m sub">' + esc((x.c.vehicles || []).join(", ")) + '</td><td class="num">' + x.s.jobs.length + '</td><td class="num">' + money(x.s.life) + '</td><td class="hide-m sub">' + (x.s.last ? esc(nice(x.s.last)) : "–") + '</td><td><span class="tag ' + x.s.cls + '">' + x.s.status + "</span></td></tr>"; }).join("") +
      "</tbody></table></div>" + (list.length ? "" : '<div class="empty">No matches.</div>');
  };

  };

  VIEWS.settings = function () {
    var s = db.settings;
    return '<form id="setForm"><div class="grid two" style="align-items:start">' +
      '<div class="grid">' +
        '<div class="panel"><h2>Business</h2><div class="f"><div class="fld"><label>Business name (used in texts)</label><input type="text" name="business" value="' + esc(s.business) + '"></div><div class="fld"><label>Rebook nudge after (days)</label><input type="number" min="14" name="rebookDays" value="' + esc(s.rebookDays) + '"></div><div class="fld full"><label>Google review link</label><input type="text" name="reviewLink" placeholder="https://g.page/r/…" value="' + esc(s.reviewLink) + '"></div></div></div>' +
        '<div class="panel"><h2>Packages &amp; pricing</h2><div id="pkgRows">' + s.packages.map(function (p) { return '<div class="set-row"><input type="text" name="pkgName" value="' + esc(p.name) + '"><input type="number" min="0" name="pkgPrice" value="' + esc(p.price) + '"><button type="button" class="x" data-act="rmRow" title="Remove">×</button></div>'; }).join("") + '</div><button type="button" class="btn btn-ghost btn-sm" data-act="addRow" data-t="pkg">+ Add package</button>' +
          '<hr class="sep"><h2>Add-ons <span class="sub">price 0 = quote per car</span></h2><div id="addRows">' + s.addons.map(function (p) { return '<div class="set-row"><input type="text" name="addName" value="' + esc(p.name) + '"><input type="number" min="0" name="addPrice" value="' + esc(p.price) + '"><button type="button" class="x" data-act="rmRow" title="Remove">×</button></div>'; }).join("") + '</div><button type="button" class="btn btn-ghost btn-sm" data-act="addRow" data-t="add">+ Add add-on</button></div>' +
      "</div>" +

      var c = cs[p[0]], pr = pkgPrice(p[1]);
      var off = p[2] === "quoted" ? -3 : p[2] === "new" ? 0 : 0;
      var created = new Date(Date.now() - (p[3] < 0 ? Math.abs(p[3]) + 3 : (p[2] === "quoted" ? 4 : p[2] === "new" ? 0 : 2)) * 864e5).toISOString();
      var upd = p[2] === "quoted" ? new Date(Date.now() - 3 * 864e5).toISOString() : created;
      db.jobs.push({ id: uid(), customerId: c.id, vehicle: c.vehicles[0], size: "Car / sedan / coupe", package: p[1], addons: p[7], price: pr, stage: p[2], date: (p[2] === "completed" || p[2] === "booked") ? addDays(t, p[3]) : "", time: p[4], location: people[p[0]][2], notes: "", source: p[6], paid: !!p[5], payMethod: ["Venmo", "Cash", "Zelle", "Card"][i % 4], tip: p[5] && i % 3 === 0 ? 10 : 0, paidAt: p[5] ? created : undefined, created: created, updated: upd, sample: true });
    });
    save(); render(); toast("Sample data loaded");
  }

  /* ============================== event wiring ============================ */
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-stop]")) { e.stopPropagation(); return; }
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.dataset.act, id = el.dataset.id;
    if (a === "scrim") { if (e.target === el) closeModal(1); return; }
    if (a === "scrim2") { if (e.target === el) closeModal(2); return; }
    switch (a) {
      case "goto": state.view = el.dataset.view; if (state.view !== "pipeline" && state.view !== "customers" && state.view !== "schedule") { /* keep search */ } render(); window.scrollTo(0, 0); break;
      case "newJob": {
        var j0 = { stage: el.dataset.date ? "booked" : "new", source: "Call / text", date: el.dataset.date || "", customerId: el.dataset.cust || "" };
        if (el.dataset.cust) { var cc = cust(el.dataset.cust); j0.vehicle = (cc.vehicles || [])[0] || ""; closeModal(1); jobModal(j0, false); var f = $("#jobForm"); if (f) { f.dataset.id = ""; $(".sheet-h h2").textContent = "New job · " + cc.name; } }
        else jobModal(j0, true);
        break;
      }
      case "editJob": var jj = job(id); if (jj) jobModal(jj, false); break;
      case "openCust": var c0 = db.customers.filter(function (x) { return x.id === id; })[0]; if (c0) custModal(c0); break;
      case "closeModal": closeModal(1); break;
      case "closeModal2": closeModal(2); break;
      case "advance": moveJob(id, { new: "quoted", quoted: "booked", booked: "completed" }[job(id).stage]); break;
      case "markPaid": var jp = job(id); if (jp) { jp.paid = true; jp.paidAt = nowISO(); save(); render(); toast("Marked paid"); } break;
      case "snooze": var cs0 = db.customers.filter(function (x) { return x.id === id; })[0]; if (cs0) { cs0.snoozeUntil = addDays(today(), 30); save(); render(); toast("Snoozed for 30 days"); } break;
      case "wk": state.weekStart = el.dataset.n === "0" ? weekStartOf(today()) : addDays(state.weekStart, Number(el.dataset.n)); render(); break;
      case "msg": msgModal(el.dataset.job, el.dataset.cust, el.dataset.tpl); break;
      case "sendSms": {
        var body = $("#msgText").value;
        window.location.href = "sms:" + el.dataset.phone + "?&body=" + encodeURIComponent(body);
        afterSend(el.dataset.job, el.dataset.tpl); break;
      }
      case "copyMsg": {
        var txt = $("#msgText"); txt.select();
        var done = function () { toast("Copied"); afterSend(el.dataset.job, el.dataset.tpl); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt.value).then(done, function () { document.execCommand("copy"); done(); });
        else { document.execCommand("copy"); done(); }
        break;
      }
      case "delJob": confirmBox("Delete this job? This can't be undone.", "Delete job", function () { db.jobs = db.jobs.filter(function (x) { return x.id !== id; }); save(); closeModal(1); closeModal(2); render(); toast("Job deleted"); }); break;
      case "delCust": confirmBox("Delete this customer and all of their jobs? This can't be undone.", "Delete customer", function () { db.jobs = db.jobs.filter(function (x) { return x.customerId !== id; }); db.customers = db.customers.filter(function (x) { return x.id !== id; }); save(); closeModal(1); closeModal(2); render(); toast("Customer deleted"); }); break;
      case "confirmYes": if (confirmBox.fn) confirmBox.fn(); break;
      case "backup": db.settings.lastBackup = nowISO(); save(); download("led-crm-backup-" + today() + ".json", JSON.stringify(db, null, 2), "application/json"); render(); toast("Backup downloaded"); break;
      case "exportCSV":
        if (el.dataset.t === "customers") download("led-customers-" + today() + ".csv", toCSV([["Name", "Phone", "Email", "Vehicles", "Jobs", "Lifetime paid", "Last detail", "Status", "Notes"]].concat(db.customers.map(function (c) { var s = custStats(c); return [c.name, c.phone, c.email, (c.vehicles || []).join("; "), s.done.length, s.life, s.last, s.status, c.notes]; }))), "text/csv");
        else download("led-jobs-" + today() + ".csv", toCSV([["Customer", "Phone", "Vehicle", "Package", "Add-ons", "Price", "Tip", "Stage", "Date", "Time", "Location", "Paid", "Method", "Source", "Notes"]].concat(db.jobs.map(function (j) { var c = cust(j.customerId); return [c.name, c.phone, j.vehicle, j.package, (j.addons || []).join("; "), j.price, j.tip, j.stage, j.date, j.time, j.location, j.paid ? "yes" : "no", j.payMethod, j.source, j.notes]; }))), "text/csv");
        break;
      case "sample": sampleData(); break;
      case "signout": if (cloud.on) firebase.auth().signOut(); break;
      case "clearSample": confirmBox("Remove all sample customers and jobs? Your real data stays.", "Remove sample data", function () { db.jobs = db.jobs.filter(function (x) { return !x.sample; }); db.customers = db.customers.filter(function (x) { return !x.sample; }); save(); closeModal(2); render(); toast("Sample data removed"); }); break;
      case "addRow": {
        var wrap = $(el.dataset.t === "pkg" ? "#pkgRows" : "#addRows"), div = document.createElement("div");
        div.className = "set-row"; var nm = el.dataset.t === "pkg" ? "pkg" : "add";
        div.innerHTML = '<input type="text" name="' + nm + 'Name" placeholder="Name"><input type="number" min="0" name="' + nm + 'Price" value="0"><button type="button" class="x" data-act="rmRow" title="Remove">×</button>';
        wrap.appendChild(div); div.firstChild.focus(); break;
      }
      case "rmRow": el.closest(".set-row").remove(); break;
    }
  });

  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.id === "jobForm") { e.preventDefault(); saveJobForm(f); }
    else if (f.id === "custForm") {
      e.preventDefault();
      var c = db.customers.filter(function (x) { return x.id === f.dataset.id; })[0], d = new FormData(f);
      c.name = String(d.get("name")).trim() || c.name; c.phone = String(d.get("phone")).trim(); c.email = String(d.get("email")).trim();
      c.vehicles = String(d.get("vehicles")).split(",").map(function (x) { return x.trim(); }).filter(Boolean); c.notes = String(d.get("notes"));
      save(); closeModal(1); render(); toast("Customer saved");
    } else if (f.id === "setForm") {
      e.preventDefault();
      var fdata = new FormData(f), s = db.settings;
      s.business = String(fdata.get("business")).trim() || "LED Detailing"; s.reviewLink = String(fdata.get("reviewLink")).trim(); s.rebookDays = Math.max(14, Number(fdata.get("rebookDays")) || 60);
      var zip = function (n, p) { var ns = fdata.getAll(n), ps = fdata.getAll(p), out = []; ns.forEach(function (x, i) { x = String(x).trim(); if (x) out.push({ name: x, price: Number(ps[i]) || 0 }); }); return out; };
      s.packages = zip("pkgName", "pkgPrice"); s.addons = zip("addName", "addPrice");
      Object.keys(TPL_LABEL).forEach(function (k) { var v = String(fdata.get("tpl_" + k) || "").trim(); s.templates[k] = v || DEFAULT_TPL[k]; });
      save(); render(); toast("Settings saved");
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "q") { state.q = t.value; if (["pipeline", "customers", "schedule"].indexOf(state.view) < 0 && t.value) state.view = "pipeline"; render(); return; }
    if (t.id === "f_price") t.dataset.manual = "1";
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "f_pkg" || (t.name === "addon" && t.closest("#f_addons"))) { var p = $("#f_price"); if (p && !p.dataset.manual) { var v = calcPrice(); p.value = v || ""; } }
    if (t.name === "stage" && t.closest("#jobForm") && t.value === "completed" && !$("#jobForm input[name=date]").value) $("#jobForm input[name=date]").value = today();
    if (t.id === "restoreFile" && t.files[0]) {
      var r = new FileReader(); r.onload = function () { try { var d = JSON.parse(r.result); if (!d.jobs || !d.customers) throw 0; confirmBox("Replace everything in this CRM with the backup file? Current data will be overwritten.", "Restore backup", function () { db = Object.assign(defaults(), d); db.settings = Object.assign(defaults().settings, d.settings || {}); db.settings.templates = Object.assign(defaults().settings.templates, (d.settings || {}).templates || {}); save(); closeModal(2); render(); toast("Backup restored"); }); } catch (err) { toast("That doesn't look like a CRM backup"); } };
      r.readAsText(t.files[0]); t.value = "";
    }
    if (t.id === "importFile" && t.files[0]) { var r2 = new FileReader(); r2.onload = function () { importCSV(String(r2.result)); }; r2.readAsText(t.files[0]); t.value = ""; }
  });

  /* drag & drop on the board */
  var dragId = null;
  document.addEventListener("dragstart", function (e) { var c = e.target.closest && e.target.closest(".card"); if (!c) return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (x) {} });
  document.addEventListener("dragend", function () { dragId = null; document.querySelectorAll(".dragging,.over").forEach(function (x) { x.classList.remove("dragging", "over"); }); });
  document.addEventListener("dragover", function (e) { var col = e.target.closest && e.target.closest(".col"); if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(function (x) { if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); } });
  document.addEventListener("drop", function (e) { var col = e.target.closest && e.target.closest(".col"); if (col && dragId) { e.preventDefault(); var id = dragId; dragId = null; moveJob(id, col.dataset.stage); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if ($("#modal2").innerHTML) closeModal(2); else closeModal(1); } });

  /* day rollover: refresh when the tab regains focus */
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  /* ============================== cloud sync ============================== */
  function canon(o) { return JSON.stringify(o, function (k, v) { if (v && typeof v === "object" && !Array.isArray(v)) { return Object.keys(v).sort().reduce(function (a, key) { if (v[key] !== undefined) a[key] = v[key]; return a; }, {}); } return v; }); }
  function clean(o) { return JSON.parse(JSON.stringify(o)); }

  function pushDiff() {
    if (!cloud.ready || !cloud.fs) return;
    var ops = [];
    ["customers", "jobs"].forEach(function (k) {
      var seen = {};
      db[k].forEach(function (o) {
        seen[o.id] = 1;
        var c = canon(o);
        if (cloud.shadow[k][o.id] !== c) { cloud.shadow[k][o.id] = c; ops.push({ ref: cloud.fs.collection(k).doc(o.id), data: clean(o) }); }
      });
      Object.keys(cloud.shadow[k]).forEach(function (id) { if (!seen[id]) { delete cloud.shadow[k][id]; ops.push({ ref: cloud.fs.collection(k).doc(id), del: true }); } });
    });
    var sc = canon(db.settings);
    if (sc !== cloud.shadow.settings) { cloud.shadow.settings = sc; ops.push({ ref: cloud.fs.collection("meta").doc("settings"), data: clean(db.settings) }); }
    for (var i = 0; i < ops.length; i += 400) {
      var batch = cloud.fs.batch();
      ops.slice(i, i + 400).forEach(function (op) { if (op.del) batch.delete(op.ref); else batch.set(op.ref, op.data); });
      batch.commit().catch(function (err) { console.error(err); toast("Couldn't save to the cloud. Check your connection."); });
    }
  }

  function applySnap(k, snap) {
    var arr = [], ids = {};
    snap.forEach(function (d) { var o = d.data(); o.id = d.id; arr.push(o); ids[d.id] = 1; cloud.shadow[k][d.id] = canon(o); });
    Object.keys(cloud.shadow[k]).forEach(function (id) { if (!ids[id]) delete cloud.shadow[k][id]; });
    db[k] = arr;
  }

  function startListeners() {
    var got = { customers: false, jobs: false, settings: false };
    function check() {
      if (cloud.ready || !(got.customers && got.jobs && got.settings)) return;
      cloud.ready = true;
      offerMigration();
      pushDiff();               // writes default settings on a brand-new project
      render();
    }
    function onErr(err) {
      console.error(err);
      var denied = err && err.code === "permission-denied";
      $("#authErr").textContent = denied ? "This account isn't authorized for the CRM." : "Couldn't connect to the database.";
      if (denied) firebase.auth().signOut();
    }
    cloud.unsubs.push(cloud.fs.collection("customers").onSnapshot(function (snap) { applySnap("customers", snap); got.customers = true; check(); if (cloud.ready) render(); }, onErr));
    cloud.unsubs.push(cloud.fs.collection("jobs").onSnapshot(function (snap) {
      var fresh = cloud.ready ? snap.docChanges().filter(function (c) { return c.type === "added" && !snap.metadata.hasPendingWrites && c.doc.data().source === "Website form" && Date.now() - new Date(c.doc.data().created).getTime() < 5 * 60e3; }) : [];
      applySnap("jobs", snap); got.jobs = true; check(); if (cloud.ready) render();
      fresh.forEach(function (c) { var jb = c.doc.data(); toast("New website lead: " + cust(jb.customerId).name); });
    }, onErr));
    cloud.unsubs.push(cloud.fs.collection("meta").doc("settings").onSnapshot(function (d) {
      if (d.exists) { var s = d.data(), base = defaults().settings; Object.keys(s).forEach(function (k) { if (k !== "templates") base[k] = s[k]; }); Object.keys(s.templates || {}).forEach(function (k) { base.templates[k] = s.templates[k]; }); db.settings = base; cloud.shadow.settings = canon(db.settings); }
      got.settings = true; check(); if (cloud.ready) render();
    }, onErr));
  }
  function stopListeners() { cloud.unsubs.forEach(function (u) { u(); }); cloud.unsubs = []; }

  function offerMigration() {
    var has = localCache && (localCache.jobs.length || localCache.customers.length);
    if (!has || db.jobs.length || db.customers.length) return;
    confirmBox("This device has " + localCache.customers.length + " customers and " + localCache.jobs.length + " jobs saved locally. Upload them to the cloud CRM?", "Upload to cloud", function () {
      db.customers = localCache.customers; db.jobs = localCache.jobs; db.settings = localCache.settings;
      localCache = null; try { localStorage.removeItem(KEY); } catch (e) {}
      save(); closeModal(2); render(); toast("Uploaded to the cloud");
    });
  }

  function showAuth() { $("#auth").hidden = false; }
  function hideAuth() { $("#auth").hidden = true; $("#authErr").textContent = ""; $("#authPw").value = ""; }
  var AUTH_MSG = { "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.", "auth/user-not-found": "Wrong email or password.", "auth/invalid-email": "Enter a valid email address.", "auth/too-many-requests": "Too many attempts. Try again in a few minutes.", "auth/network-request-failed": "No connection. Check your internet." };

  function bootCloud() {
    firebase.initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, appId: cfg.appId });
    cloud.fs = firebase.firestore();
    try { cloud.fs.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
    showAuth();
    document.addEventListener("submit", function (e) {
      if (e.target.id !== "authForm") return;
      e.preventDefault(); $("#authErr").textContent = "";
      firebase.auth().signInWithEmailAndPassword($("#authEmail").value.trim(), $("#authPw").value).catch(function (err) { $("#authErr").textContent = AUTH_MSG[err.code] || "Couldn't sign in. Try again."; });
    });
    $("#authReset").addEventListener("click", function () {
      var em = $("#authEmail").value.trim();
      if (!em) { $("#authErr").textContent = "Type your email above first."; return; }
      firebase.auth().sendPasswordResetEmail(em).then(function () { $("#authErr").style.color = "var(--green)"; $("#authErr").textContent = "Password reset email sent."; }, function (err) { $("#authErr").style.color = ""; $("#authErr").textContent = AUTH_MSG[err.code] || "Couldn't send the reset email."; });
    });
    firebase.auth().onAuthStateChanged(function (u) {
      if (u) { cloud.user = u; hideAuth(); render(); startListeners(); }
      else { stopListeners(); cloud.user = null; cloud.ready = false; cloud.shadow = { customers: {}, jobs: {}, settings: "" }; db = defaults(); closeModal(1); closeModal(2); showAuth(); render(); }
    });
  }

  if (cloud.on) bootCloud();
  render();
})();
</script>
</body>
